[package]
name = "qubit-local-files-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "^0.4"
qubit-io = "^0.19"
qubit-local-files = { path = ".." }
sha2 = { version = "^0.11", optional = true }

[features]
conditional = ["dep:sha2", "qubit-local-files/digest", "qubit-local-files/test-support"]

[[test]]
name = "lifecycle_model_tests"
path = "fuzz_targets/lifecycle_model_tests.rs"

[[test]]
name = "conditional_model_tests"
path = "fuzz_targets/conditional_model_tests.rs"
required-features = ["conditional"]

[[bin]]
name = "conditional_lifecycle"
path = "fuzz_targets/conditional_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_codec"
path = "fuzz_targets/path_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "local_paths"
path = "fuzz_targets/local_paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lifecycle"
path = "fuzz_targets/lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rooted_lifecycle"
path = "fuzz_targets/rooted_lifecycle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "copy_lifecycle"
path = "fuzz_targets/copy_lifecycle.rs"
test = false
doc = false
bench = false
