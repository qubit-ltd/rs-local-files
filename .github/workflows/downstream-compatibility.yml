name: Downstream compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/downstream-compatibility.yml"
      - ".github/workflows/downstream-contracts.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/downstream-contracts.yml
    with:
      local_files_ref: ${{ github.sha }}
      fs_local_ref: main
      mime_ref: main
      support_ref: main
