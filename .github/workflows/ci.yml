name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@main
    with:
      run_windows_tests: true
      run_macos_tests: true
    secrets: inherit

  unix-cross-check:
    name: Check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - armv7-linux-androideabi

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Rust target
        run: rustup toolchain install 1.94 --profile minimal --target ${{ matrix.target }}

      - name: Check target
        run: cargo +1.94 check --target ${{ matrix.target }}

  rooted-atomic-durability:
    name: Rooted atomic durability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace

      - name: Install Rust
        run: rustup toolchain install 1.94 --profile minimal

      - name: Trace rooted atomic parent synchronization
        run: >-
          cargo +1.94 test --test lib_tests
          local::local_root_atomic_writer_tests::test_commit_syncs_new_parent_chain
          -- --exact --nocapture
