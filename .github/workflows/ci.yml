name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main
    with:
      feature-test-os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      cross-targets: '["x86_64-unknown-freebsd", "armv7-linux-androideabi"]'
      contract-tests: '["delete_contract_tests", "delete_contract_symlink_tests", "error_tests", "local_file_reader_tests", "rooted_resolution_fast_path_tests"]'
      fuzz-check: true

  downstream-contracts:
    name: Coordinated downstream contracts
    permissions:
      contents: read
    uses: ./.github/workflows/downstream-contracts.yml
    with:
      local_files_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      fs_local_ref: main
      mime_ref: main
      support_ref: main
