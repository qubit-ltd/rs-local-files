name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@main
    with:
      run_windows_tests: true
      run_macos_tests: true
      coverage_enforce_thresholds: "1"
    secrets: inherit

  unix-cross-check:
    name: Compile-only ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - armv7-linux-androideabi

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Rust target
        run: rustup toolchain install 1.94 --profile minimal --target ${{ matrix.target }}

      - name: Compile-only check target
        run: cargo +1.94 check --target ${{ matrix.target }}

  test-discovery:
    name: Default-feature integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Rust
        run: rustup toolchain install 1.94 --profile minimal

      - name: Compile default-feature tests
        run: cargo +1.94 test --no-default-features --no-run

      - name: Run nested integration test discovery
        run: >-
          cargo +1.94 test --test lib_tests
          options::local_copy_source_mode_tests::test_local_copy_source_modes_are_distinct
          -- --exact
