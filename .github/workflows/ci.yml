name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@main
    with:
      run_windows_tests: true
      run_macos_tests: true
      coverage_enforce_thresholds: "1"
    secrets: inherit

  unix-cross-check:
    name: Compile-only ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - armv7-linux-androideabi

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Rust target
        run: rustup toolchain install 1.94 --profile minimal --target ${{ matrix.target }}

      - name: Compile-only check target
        run: cargo +1.94 check --target ${{ matrix.target }}

  test-discovery:
    name: Default-feature tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Rust
        run: rustup toolchain install 1.94 --profile minimal

      - name: Run default-feature tests
        run: cargo +1.94 test --locked --no-default-features

  local-contract-regressions:
    name: Local filesystem contract regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Rust
        run: rustup toolchain install 1.94 --profile minimal

      - name: Check deletion contract
        run: cargo +1.94 test --all-features --locked --test delete_contract_tests

      - name: Check deletion symlink contract
        run: cargo +1.94 test --all-features --locked --test delete_contract_symlink_tests

      - name: Check error cause and effect queries
        run: cargo +1.94 test --all-features --locked --test error_tests

      - name: Check vectored reader contract
        run: cargo +1.94 test --all-features --locked --test local_file_reader_tests

      - name: Check Rooted resolution fast path
        run: cargo +1.94 test --all-features --locked --test rooted_resolution_fast_path_tests
