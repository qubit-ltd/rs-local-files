name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-dependency-pins:
    name: CI dependency pin consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run project Python regression tests and check dependency pins
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check-ci-dependency-pins.py

  freebsd-ci:
    name: FreeBSD compatibility checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Run tests in FreeBSD 14.3
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.3"
          prepare: |
            pkg install -y bash ca_root_nss git
            test ! -e ../rs-redact
            git init ../rs-redact
            git -C ../rs-redact remote add origin https://github.com/qubit-ltd/rs-redact.git
            git -C ../rs-redact fetch --depth 1 origin 04f4bef3ac9a391cc220438918dcb1451a1963a6
            git -C ../rs-redact checkout --detach FETCH_HEAD
            test "$(git -C ../rs-redact rev-parse HEAD)" = 04f4bef3ac9a391cc220438918dcb1451a1963a6
            test ! -e ../rs-json
            git init ../rs-json
            git -C ../rs-json remote add origin https://github.com/qubit-ltd/rs-json.git
            git -C ../rs-json fetch --depth 1 origin 0bc4aa9eb0aa2993aa4a75c4162e7ae45f2bebab
            git -C ../rs-json checkout --detach FETCH_HEAD
            test "$(git -C ../rs-json rev-parse HEAD)" = 0bc4aa9eb0aa2993aa4a75c4162e7ae45f2bebab
            toolchain_dir=$(mktemp -d)
            trap 'rm -rf "$toolchain_dir"' EXIT
            fetch -qo "$toolchain_dir/rust.tar.xz" https://static.rust-lang.org/dist/rust-1.94.0-x86_64-unknown-freebsd.tar.xz
            tar -xf "$toolchain_dir/rust.tar.xz" -C "$toolchain_dir"
            "$toolchain_dir/rust-1.94.0-x86_64-unknown-freebsd/install.sh" --prefix=/usr/local --without=rust-docs
            pw useradd ci-runner -m -s /bin/sh
            mkdir -p /tmp/ci-home /tmp/ci-cargo /tmp/ci-target
            chown -R ci-runner:ci-runner /tmp/ci-home /tmp/ci-cargo /tmp/ci-target
          run: |
            cargo --version
            CARGO_HOME=/tmp/ci-cargo cargo fetch --locked
            chown -R ci-runner:ci-runner /tmp/ci-cargo
            su -m ci-runner -c 'id && cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo check --locked --all-targets --no-default-features'
            su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo check --locked --all-targets --all-features'
            su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked --no-default-features --lib test_attribute_read'
            su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked --all-features --lib test_attribute_read'
            su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked --all-features --lib test_attribute_list'
            su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked --no-default-features --doc'
            su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked --all-features --doc'
            su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked --all-features --test host_fault_and_guarantee_tests test_freebsd_xattr_short_read_and_atomic_preservation'
            if conditional_output=$(su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked --features digest --test conditional_lf3_tests lf3_conditional_ -- --nocapture' 2>&1); then
              printf '%s\n' "$conditional_output"
            else
              printf '%s\n' "$conditional_output"
              exit 1
            fi
            if ! printf '%s\n' "$conditional_output" | grep -Fq 'test test_lf3_conditional_content_is_rejected_before_path_work_on_unsupported_unix ... ok'; then
              echo 'FreeBSD Unsupported conditional contract test did not run successfully with digest' >&2
              exit 1
            fi
            if conditional_output=$(su -m ci-runner -c 'cd "$GITHUB_WORKSPACE" && HOME=/tmp/ci-home CARGO_HOME=/tmp/ci-cargo CARGO_TARGET_DIR=/tmp/ci-target cargo test --locked --all-features --test conditional_lf3_tests lf3_conditional_ -- --nocapture' 2>&1); then
              printf '%s\n' "$conditional_output"
            else
              printf '%s\n' "$conditional_output"
              exit 1
            fi
            if ! printf '%s\n' "$conditional_output" | grep -Fq 'test test_lf3_conditional_content_is_rejected_before_path_work_on_unsupported_unix ... ok'; then
              echo 'FreeBSD Unsupported conditional contract test did not run successfully with all features' >&2
              exit 1
            fi

  rust-ci:
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main
    with:
      # The shared verify jobs prepare sibling path dependencies; its other Cargo jobs do not.
      verify-os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      feature-test-os: '[]'
      cross-targets: '[]'
      contract-tests: '[]'
      # Fuzz binaries are compiled explicitly in the Linux verify-extra-script below.
      fuzz-check: false
      verify-extra-script: |2
        if [ "$RUNNER_OS" = Windows ]; then
          export TEMP="$RUNNER_TEMP"
          export TMP="$RUNNER_TEMP"
          powershell.exe -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; $os = Get-CimInstance Win32_OperatingSystem; $volume = Get-Volume -FilePath $env:GITHUB_WORKSPACE; $partition = Get-Partition -DriveLetter $volume.DriveLetter; $disk = Get-Disk -Number $partition.DiskNumber; Write-Output "Windows OS:"; $os | Select-Object Caption, Version, BuildNumber | ConvertTo-Json -Compress; Write-Output "Workspace volume and disk:"; [pscustomobject]@{ DriveLetter = $volume.DriveLetter; FileSystemType = $volume.FileSystemType; DriveType = $volume.DriveType; DiskNumber = $disk.Number; BusType = $disk.BusType; FriendlyName = $disk.FriendlyName; PartitionStyle = $disk.PartitionStyle } | ConvertTo-Json -Compress; Write-Output "Runner identity:"; whoami; Write-Output "Workspace ACL:"; icacls $env:GITHUB_WORKSPACE; Write-Output "Runner temp ACL:"; icacls $env:RUNNER_TEMP'
        fi
        export QUBIT_LOCAL_FILES_REQUIRE_SYMLINKS=1
        run_named_test() {
          local target="$1"
          local name="$2"
          shift 2
          local output
          local alternate_name
          local target_args=(--test "$target")
          if [ "$target" = "--lib" ]; then
            target_args=(--lib)
          fi
          if [[ "$name" == test_* ]]; then
            alternate_name="${name#test_}"
          else
            alternate_name="test_${name}"
          fi
          for candidate in "$name" "$alternate_name"; do
            if output=$(cargo test --locked "$@" "${target_args[@]}" "$candidate" -- --exact --nocapture 2>&1); then
              printf '%s\n' "$output"
            else
              printf '%s\n' "$output"
              return 1
            fi
            if grep -Fq "test $candidate ... ok" <<<"$output"; then
              return 0
            fi
          done
          echo "expected exact test body to run: $target::$name (or $alternate_name)" >&2
          return 1
        }
        cargo test --locked --no-default-features --no-fail-fast
        cargo test --locked --all-features --no-fail-fast
        cargo test --locked --test resolution_contract_tests
        if [ "$RUNNER_OS" = Windows ]; then
          run_named_test rooted_windows_symlink_tests test_windows_symlink_fixture_preflight
          run_named_test rooted_windows_symlink_tests test_rooted_copy_preserves_dangling_link_after_root_rename
          run_named_test rooted_windows_symlink_tests test_rooted_copy_preserves_dangling_directory_link_kind
          run_named_test rooted_windows_symlink_tests test_rooted_link_copy_ignores_replacement_diagnostic_root
          run_named_test rooted_windows_symlink_tests test_rooted_copy_preserves_link_to_existing_external_file
          run_named_test rooted_windows_symlink_tests test_rooted_copy_uses_actual_reparse_target_instead_of_display_name
          run_named_test resolution_contract_tests test_opening_root_target_hook_sees_and_can_reject_raw_nt_substitute_name
          run_named_test --lib tests::temp::internal::privacy_windows_tests::test_owner_policy_windows_create_apply_verify_uses_exact_dacl_mask
          run_named_test --lib tests::temp::internal::privacy_windows_tests::test_owner_policy_windows_directory_create_apply_verify_uses_exact_dacl_mask
          run_named_test --lib tests::lf3_privacy_windows_access_transition_tests::test_review_windows_access_transition_preserves_readonly_attribute_and_acl
          run_named_test --lib tests::lf3_privacy_windows_access_transition_tests::test_review_windows_owner_policy_preserves_preexisting_readonly_attribute
          run_named_test --lib tests::lf3_tree_publish_tests::test_windows_access_failure_after_child_mutation_reports_mixed_and_keeps_stage
          run_named_test --lib tests::temp::internal::privacy_windows_tests::test_owner_policy_windows_create_apply_verify_uses_exact_dacl_mask --all-features
          run_named_test --lib tests::temp::internal::privacy_windows_tests::test_owner_policy_windows_directory_create_apply_verify_uses_exact_dacl_mask --all-features
          run_named_test --lib tests::lf3_privacy_windows_access_transition_tests::test_review_windows_access_transition_preserves_readonly_attribute_and_acl --all-features
          run_named_test --lib tests::lf3_privacy_windows_access_transition_tests::test_review_windows_owner_policy_preserves_preexisting_readonly_attribute --all-features
          run_named_test --lib tests::lf3_tree_publish_tests::test_windows_access_failure_after_child_mutation_reports_mixed_and_keeps_stage --all-features
          run_named_test --lib tests::rooted_copy_deadline_tests::test_rooted_link_kind_deadline_keeps_existing_file
          run_named_test windows_rooted_staging_cleanup_tests test_rooted_staging_abort_preserves_competitor_at_old_name
          run_named_test windows_rooted_staging_cleanup_tests test_rooted_staging_drop_preserves_competitor_at_old_name
          run_named_test windows_rooted_staging_cleanup_tests test_rooted_staging_failed_commit_cleanup_preserves_competitor_at_old_name
          run_named_test windows_rooted_staging_cleanup_tests test_rooted_staging_abort_preserves_competitor_at_old_name --all-features
          run_named_test windows_rooted_staging_cleanup_tests test_rooted_staging_drop_preserves_competitor_at_old_name --all-features
          run_named_test windows_rooted_staging_cleanup_tests test_rooted_staging_failed_commit_cleanup_preserves_competitor_at_old_name --all-features
        fi
        if [ "$RUNNER_OS" != Windows ]; then
          cargo test --locked --test security_observation_contract_tests
        fi
        if [ "$RUNNER_OS" = Linux ]; then
          cargo check --locked --manifest-path fuzz/Cargo.toml --bins
          model_test_output=$(cargo test --locked --manifest-path fuzz/Cargo.toml --test lifecycle_model_tests 2>&1) || {
            printf '%s\n' "$model_test_output"
            exit 1
          }
          printf '%s\n' "$model_test_output"
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' <<< "$model_test_output"; then
            echo 'lifecycle model suite did not execute at least one test' >&2
            exit 1
          fi
          cargo check --locked --manifest-path fuzz/Cargo.toml --features conditional --bins
          conditional_model_output=$(cargo test --locked --manifest-path fuzz/Cargo.toml --features conditional --test conditional_model_tests 2>&1) || {
            printf '%s\n' "$conditional_model_output"
            exit 1
          }
          printf '%s\n' "$conditional_model_output"
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed;' <<< "$conditional_model_output"; then
            echo 'conditional model suite did not execute at least one test' >&2
            exit 1
          fi
          rustup toolchain install nightly-2026-06-05 --profile minimal
          if ! cargo fuzz --version 2>/dev/null | grep -Fxq 'cargo-fuzz 0.13.2'; then
            cargo install cargo-fuzz --version 0.13.2 --locked --force
          fi
          set -o pipefail
          snapshot_fuzz_artifacts() {
            python3 - "$1" "$2" <<'PYCODE'
        import hashlib
        import json
        import os
        import sys

        root, snapshot = sys.argv[1:]
        artifacts = {}
        for directory, _, names in os.walk(root):
            for name in names:
                path = os.path.join(directory, name)
                relative = os.path.relpath(path, root)
                stat = os.stat(path)
                with open(path, "rb") as stream:
                    digest = hashlib.sha256(stream.read()).hexdigest()
                artifacts[relative] = [stat.st_size, stat.st_mtime_ns, digest]
        with open(snapshot, "w", encoding="utf-8") as stream:
            json.dump(artifacts, stream, sort_keys=True)
        PYCODE
          }
          write_changed_fuzz_artifacts() {
            python3 - "$1" "$2" "$3" "$4" <<'PYCODE'
        import json
        import os
        import sys

        root, before_path, after_path, output_path = sys.argv[1:]
        with open(before_path, encoding="utf-8") as stream:
            before = json.load(stream)
        with open(after_path, encoding="utf-8") as stream:
            after = json.load(stream)
        changed = sorted(
            (relative for relative, metadata in after.items()
             if before.get(relative) != metadata),
            key=os.fsencode,
        )
        with open(output_path, "wb") as stream:
            for relative in changed:
                stream.write(os.fsencode(os.path.join(root, relative)) + b"\0")
        PYCODE
          }
          for target in conditional_lifecycle path_codec local_paths lifecycle rooted_lifecycle copy_lifecycle; do
            echo "FUZZ START: $target"
            fuzz_log="$RUNNER_TEMP/fuzz-$target.log"
            fuzz_artifacts="fuzz/artifacts/$target"
            before_artifacts="$RUNNER_TEMP/fuzz-$target-before.txt"
            after_artifacts="$RUNNER_TEMP/fuzz-$target-after.txt"
            new_artifacts="$RUNNER_TEMP/fuzz-$target-new.txt"
            mkdir -p "$fuzz_artifacts"
            snapshot_fuzz_artifacts "$fuzz_artifacts" "$before_artifacts"
            if cargo +nightly-2026-06-05 fuzz run "$target" --features conditional -- -max_total_time=10 -max_len=4096 2>&1 | tee "$fuzz_log"; then
              fuzz_status=0
            else
              fuzz_status=$?
            fi
            if [ "$fuzz_status" -eq 0 ] && grep -Eq '^Done [1-9][0-9]* runs in [0-9]+ second\(s\)$' "$fuzz_log"; then
              echo "FUZZ PASS: $target"
            else
              if [ "$fuzz_status" -eq 0 ]; then
                fuzz_status=1
                echo "FUZZ FAIL: $target (libFuzzer did not report a positive completed run count)" >&2
              else
                echo "FUZZ FAIL: $target (exit $fuzz_status)" >&2
              fi
              echo "log: $fuzz_log" >&2
              snapshot_fuzz_artifacts "$fuzz_artifacts" "$after_artifacts"
              write_changed_fuzz_artifacts "$fuzz_artifacts" "$before_artifacts" "$after_artifacts" "$new_artifacts"
              if [ -s "$new_artifacts" ]; then
                while IFS= read -r -d '' artifact; do
                  echo "failure input: $artifact" >&2
                  printf 'replay: cargo +nightly-2026-06-05 fuzz run %q %q --features conditional\n' "$target" "$artifact" >&2
                  echo 'input bytes (hex):' >&2
                  od -An -v -tx1 "$artifact" >&2
                done < "$new_artifacts"
              else
                echo 'no failure input files were created during this run' >&2
              fi
              exit 1
            fi
          done
          cargo test --locked --test owner_policy_lifecycle_tests
          uid_build_log="$RUNNER_TEMP/local-files-uid-build.jsonl"
          cargo test --locked --test stage_reopen_effective_uid_tests --no-run --message-format=json > "$uid_build_log"
          uid_test_binary=$(python3 - "$uid_build_log" <<'PYCODE'
        import json
        import os
        import sys
        found = set()
        with open(sys.argv[1], encoding="utf-8") as stream:
            for line in stream:
                message = json.loads(line)
                if (message.get("reason") == "compiler-artifact"
                        and message.get("target", {}).get("name") == "stage_reopen_effective_uid_tests"
                        and message.get("executable")):
                    found.add(message["executable"])
        if len(found) != 1:
            raise SystemExit("expected one UID test executable")
        path = found.pop()
        if not os.path.isfile(path) or not os.access(path, os.X_OK):
            raise SystemExit("UID test executable is unavailable")
        print(path)
        PYCODE
          )
          if uid_test_output=$(sudo -n -- "$uid_test_binary" --exact unix::test_reopen_uses_effective_uid_child --nocapture 2>&1); then
            printf '%s\n' "$uid_test_output"
          else
            printf '%s\n' "$uid_test_output"
            exit 1
          fi
          if ! grep -Fq 'test unix::test_reopen_uses_effective_uid_child ... ok' <<< "$uid_test_output"; then
            echo 'UID-difference exact test did not run successfully' >&2
            exit 1
          fi
          if ! grep -Fxq 'UID-difference scenario EXECUTED: 1 isolated Linux child completed' <<< "$uid_test_output"; then
            echo 'UID-difference scenario completion marker was missing' >&2
            exit 1
          fi
          rustup target add --toolchain 1.94 x86_64-unknown-freebsd armv7-linux-androideabi
          cargo +1.94 check --locked --target x86_64-unknown-freebsd
          cargo +1.94 check --locked --target armv7-linux-androideabi
        fi

  conditional-write:
    name: Conditional write contracts
    permissions:
      contents: read
    uses: ./.github/workflows/conditional-write.yml
