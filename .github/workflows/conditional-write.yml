name: Conditional write contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci-root/rs-local-files
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: main
          path: ci-root/rs-redact
          submodules: recursive
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.94 --profile minimal
      # Enable remotely only after platform, manager and CI tools are distributable.
      - name: Run shared conditional suites
        working-directory: ci-root/rs-local-files
        run: |
          suites=digest-build,digest-library,digest-integration,conditional-contracts,conditional-library
          case "$RUNNER_OS" in
            Linux) platform=linux; suites="$suites,lifecycle-model" ;;
            Windows) platform=windows ;;
            macOS) platform=macos; suites="$suites,lifecycle-model" ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          ./.infra/bin/infra-tool.sh rs-infra-platform --project . check --platform "$platform" --suite "$suites" --require "$platform"

  windows-recovery:
    name: Windows rollback recovery contracts
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci-root/rs-local-files
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: main
          path: ci-root/rs-redact
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-json
          ref: main
          path: ci-root/rs-json
          submodules: recursive
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.94 --profile minimal
      - name: Run rollback recovery contracts
        working-directory: ci-root/rs-local-files
        run: ./.infra/bin/infra-tool.sh rs-infra-platform --project . check --platform windows --suite conditional-recovery --require windows
