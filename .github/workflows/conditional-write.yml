name: Conditional write contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci-root/rs-local-files
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install MSRV
        run: rustup toolchain install 1.94 --profile minimal
      - name: Prepare isolated coordinated sources
        env:
          CI: 'true'
        run: >-
          python ci-root/rs-local-files/scripts/prepare_downstream_sources.py
          --root ci-root --candidate ci-root/rs-local-files
          --fs-local-ref main --mime-ref main --support-ref main
          --additional-ref rs-io=c44e597e82171ba4ac3767b97d50e4413ba56aca
      - name: Check plain digest build
        working-directory: ci-root/rs-local-files
        run: cargo +1.94 check --locked --features digest
      - name: Run conditional contracts
        working-directory: ci-root/rs-local-files
        run: >-
          cargo +1.94 test --locked --features digest,test-support
          --test conditional_writer_tests --test conditional_vectored_tests
          --test conditional_publication_race_tests
          --test conditional_recovery_tests --test conditional_fault_tests
          --test conditional_feature_gate_tests
      - name: Run private state and native backend contracts
        working-directory: ci-root/rs-local-files
        run: cargo +1.94 test --locked --features digest,test-support --lib conditional_
