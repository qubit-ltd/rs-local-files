name: Conditional write contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci-root/rs-local-files
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: main
          path: ci-root/rs-redact
          submodules: recursive
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.94 --profile minimal
      - name: Check plain digest build
        working-directory: ci-root/rs-local-files
        run: cargo +1.94 check --locked --features digest
      - name: Run plain digest library tests
        working-directory: ci-root/rs-local-files
        run: cargo +1.94 test --locked --features digest --lib conditional_
      - name: Run plain digest integration contracts
        working-directory: ci-root/rs-local-files
        run: >-
          cargo +1.94 test --locked --features digest
          --test conditional_writer_tests --test conditional_vectored_tests
          --test conditional_backend_contract_tests
      - name: Run fuzz lifecycle model tests
        if: runner.os != 'Windows'
        working-directory: ci-root/rs-local-files
        run: >-
          cargo +1.94 test --locked --manifest-path fuzz/Cargo.toml
          --test lifecycle_model_tests
      - name: Run conditional contracts
        working-directory: ci-root/rs-local-files
        run: >-
          cargo +1.94 test --locked --features digest,test-support
          --test conditional_writer_tests --test conditional_vectored_tests
          --test conditional_publication_race_tests
          --test conditional_recovery_tests --test conditional_fault_tests
          --test conditional_feature_gate_tests
      - name: Run private state and native backend contracts
        working-directory: ci-root/rs-local-files
        run: cargo +1.94 test --locked --features digest,test-support --lib conditional_

  windows-recovery:
    name: Windows rollback recovery contracts
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci-root/rs-local-files
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: main
          path: ci-root/rs-redact
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-json
          ref: main
          path: ci-root/rs-json
          submodules: recursive
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.94 --profile minimal
      - name: Run rollback recovery contracts
        working-directory: ci-root/rs-local-files
        run: cargo +1.94 test --locked --features digest,test-support --test conditional_recovery_tests
