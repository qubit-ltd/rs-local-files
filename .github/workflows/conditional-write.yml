name: Conditional write contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci-root/rs-local-files
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: main
          path: ci-root/rs-redact
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-json
          ref: main
          path: ci-root/rs-json
          submodules: recursive
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.94 --profile minimal
      # Enable remotely only after platform, manager and CI tools are distributable.
      - name: Run shared conditional suites
        working-directory: ci-root/rs-local-files
        run: |
          export QUBIT_LOCAL_FILES_REQUIRE_SYMLINKS=1
          test_status=0
          run_named_test() {
            local target="$1"
            local name="$2"
            local output
            if output=$(cargo test --locked --test "$target" "$name" -- --exact --nocapture 2>&1); then
              printf '%s\n' "$output"
            else
              printf '%s\n' "$output"
              test_status=1
              return 0
            fi
            if ! grep -Fq "test $name ... ok" <<<"$output"; then
              echo "expected exact test body to run: $target::$name" >&2
              test_status=1
            fi
          }
          run_tests() {
            if output=$(cargo test "$@" 2>&1); then
              :
            else
              printf '%s\n' "$output"
              test_status=1
              return 0
            fi
            printf '%s\n' "$output"
            if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$output"; then
              echo "expected at least one test for: cargo test $*" >&2
              test_status=1
            fi
          }
          cargo check --locked --features digest
          run_tests --locked --features digest --lib conditional_
          run_tests --locked --features digest \
            --test conditional_writer_tests \
            --test conditional_vectored_tests \
            --test conditional_backend_contract_tests
          run_tests --locked --features digest,test-support \
            --test conditional_writer_tests \
            --test conditional_vectored_tests \
            --test conditional_publication_race_tests \
            --test conditional_recovery_tests \
            --test conditional_fault_tests \
            --test conditional_feature_gate_tests
          run_tests --locked --test resolution_contract_tests
          run_tests --locked --features digest,test-support --lib conditional_
          case "$RUNNER_OS" in
            Linux|macOS)
              run_tests --locked --test security_observation_contract_tests
              if [ "$RUNNER_OS" = Linux ]; then
                run_tests --locked --test owner_policy_lifecycle_tests
              fi
              ;;
            Windows)
              run_named_test rooted_windows_symlink_tests test_windows_symlink_fixture_preflight
              run_named_test rooted_windows_symlink_tests test_rooted_copy_preserves_dangling_link_after_root_rename
              run_named_test rooted_windows_symlink_tests test_rooted_copy_preserves_dangling_directory_link_kind
              run_named_test rooted_windows_symlink_tests test_rooted_link_copy_ignores_replacement_diagnostic_root
              run_named_test rooted_windows_symlink_tests test_rooted_copy_preserves_link_to_existing_external_file
              run_named_test rooted_windows_symlink_tests test_rooted_copy_uses_actual_reparse_target_instead_of_display_name
              run_named_test resolution_contract_tests opening_root_target_hook_sees_and_can_reject_raw_nt_substitute_name
              run_tests --locked --lib lf_review_stage_cleanup_
              run_tests --locked --lib lf_review_tree_
              run_tests --locked --all-features --lib lf3_privacy_windows_
              run_tests --locked --lib lf3_temp_windows_required_private_creation_and_seal
              run_tests --locked --features digest,test-support \
                --test conditional_recovery_tests windows_cleanup_
              run_tests --locked --features digest,test-support \
                --test conditional_writer_tests windows_open_
              run_tests --locked --test local_temp_file_tests test_required_private_windows_
              run_tests --locked --features test-support --test local_temp_file_tests windows_sealed_cleanup_
              ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          exit "$test_status"

  windows-recovery:
    name: Windows rollback recovery contracts
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: ci-root/rs-local-files
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-redact
          ref: main
          path: ci-root/rs-redact
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: qubit-ltd/rs-json
          ref: main
          path: ci-root/rs-json
          submodules: recursive
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install 1.94 --profile minimal
      - name: Run rollback recovery contracts
        working-directory: ci-root/rs-local-files
        run: cargo test --locked --features digest,test-support --test conditional_recovery_tests windows_cleanup_
