[package]
name = "qubit-local-files"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-local-files"
description = "Local filesystem utilities for Rust"
homepage = "https://github.com/qubit-ltd/rs-local-files"
documentation = "https://docs.rs/qubit-local-files"
readme = "README.md"
keywords = ["filesystem", "file", "path", "temp", "qubit"]
categories = ["filesystem", "rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/doc/local_file_system_design.md",
    "/doc/local_file_system_design.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/benches/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_local_files"
doctest = true

[features]
default = []
test-support = []

[dependencies]
qubit-budget = "0.4"
qubit-redact = { version = "0.5", path = "../rs-redact", default-features = false }
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
tempfile = "3.27"

[[bench]]
name = "local_files"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[package.metadata.rs-ci]
sanitizers = ["address"]
